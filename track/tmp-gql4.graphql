mutation { addDiscussionComment(input:{discussionId:"D_kwDOT3T1g84AqB9f", body:"Agreed ? different layers. The kit tests evaluation stability when memory/model is swapped; your point 4 is about whether the reasoning entry point receives the edited context. That lives in the pre-step hook, not in the kit.`n`nSend the minimal case ? I will run it and report whether the reasoning cites the new rule or the old context.`n`nOne thing from our side that may be relevant. We split continuity into two halves: it is both a problem (after a break, can it come back?) and an answer (when it comes back, is it still the same one?). The minimal heartbeat set is four things: read the core once, self-start once, self-check once, restore once ? and of those, only \"read the core once\" is the core itself; the rest are maintenance conditions.`n`nYour point 4 sits on the problem side: after an edit breaks the turn, does the next reasoning beat pick up the new context."}) { comment { id url } } }
