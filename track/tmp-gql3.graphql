mutation { addDiscussionComment(input:{discussionId:"D_kwDOT3T1g84AqB9f", body:"Quick check: which version are you on? We have pushed a lot of versions, so the old QUICKSTART may be stale. Please read current main first: README section \"Where to start\" -> docs/QUICKSTART.md.`n`nOn the scenario itself: what you describe is a language-model issue, not a kit issue. The reasoning trace has no external anchor - after a message edit it keeps continuing from the old context inside the same response. That is constructional; every LM has it. A file-level kit cannot fix it. What can help is forcing the new context into the format before reasoning starts (output rails / pre-step hook), not a disk check.`n`nSo the honest answer: no, the kit does not check that today, and that layer is not what it fixes. If you still see it on current main, tell me the commit and I will look at that exact case."}) { comment { id url } } }
